services:
  db:
    image: postgres
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    container_name: postgres-home-library-service
    volumes:
      # Database data files (persistent storage)
      - ./pgdata:/var/lib/postgresql
      # Database logs (persistent storage)
      - ./pglogs:/var/log/postgresql
    ports:
      - '${DB_PORT}:5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-library-service-nodejs2025Q2
    env_file:
      - .env 
    ports:
      - '${PORT}:4000'
    depends_on:
      - db
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

