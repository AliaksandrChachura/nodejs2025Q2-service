services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    container_name: postgres-home-library-service
    volumes:
      # Database data files (persistent storage)
      - ./pgdata:/var/lib/postgresql/data
      # Database logs (persistent storage)
      - ./pglogs:/var/log/postgresql
      # Initialization scripts (optional)
      # - ./docker/postgres/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - '${DB_PORT}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nest} -d ${POSTGRES_DB:-nestdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: home-library-service-nodejs2025Q2
    env_file:
      - .env 
    ports:
      - '${PORT}:4000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

